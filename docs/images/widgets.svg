<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The three dashboard widgets: now playing, quick play, recently played (illustration)</title>
  <defs>
    <linearGradient id="cover1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1db954"/>
      <stop offset="1" stop-color="#0b5c2a"/>
    </linearGradient>
    <linearGradient id="cover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8250df"/>
      <stop offset="1" stop-color="#3b1f7a"/>
    </linearGradient>
    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e16f24"/>
      <stop offset="1" stop-color="#7a2e0b"/>
    </linearGradient>
    <linearGradient id="cover4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#0a3069"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="420" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- Now playing -->
  <rect x="30" y="30" width="260" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="56" font-size="13" font-weight="600" fill="#24292f">Spotify now playing</text>
  <rect x="46" y="68" width="228" height="128" rx="6" fill="url(#cover1)"/>
  <circle cx="160" cy="132" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="160" cy="132" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <text x="46" y="220" font-size="15" font-weight="600" fill="#24292f">Track title</text>
  <text x="46" y="238" font-size="11" fill="#57606a">Artist — Album</text>
  <text x="46" y="262" font-size="11" fill="#57606a">Device</text>
  <text x="274" y="262" text-anchor="end" font-size="11" fill="#24292f">Living room</text>
  <text x="46" y="280" font-size="11" fill="#57606a">State</text>
  <text x="274" y="280" text-anchor="end" font-size="11" fill="#24292f">Playing</text>
  <text x="46" y="298" font-size="11" fill="#57606a">Volume</text>
  <text x="274" y="298" text-anchor="end" font-size="11" fill="#24292f">45 %</text>
  <rect x="46" y="314" width="70" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="81" y="332" text-anchor="middle" font-size="11" fill="#24292f">Previous</text>
  <rect x="125" y="314" width="70" height="28" rx="6" fill="#1db954"/>
  <text x="160" y="332" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Pause</text>
  <rect x="204" y="314" width="70" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="239" y="332" text-anchor="middle" font-size="11" fill="#24292f">Next</text>
  <rect x="46" y="350" width="228" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="160" y="368" text-anchor="middle" font-size="11" fill="#24292f">Open Spotify</text>

  <!-- Quick play -->
  <rect x="310" y="30" width="260" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="326" y="56" font-size="13" font-weight="600" fill="#24292f">Spotify quick play</text>
  <rect x="326" y="70" width="108" height="108" rx="6" fill="url(#cover2)"/>
  <rect x="446" y="70" width="108" height="108" rx="6" fill="url(#cover3)"/>
  <rect x="326" y="226" width="108" height="108" rx="6" fill="url(#cover4)"/>
  <rect x="446" y="226" width="108" height="108" rx="6" fill="url(#cover1)"/>
  <text x="326" y="194" font-size="11" font-weight="600" fill="#24292f">Morning mix</text>
  <text x="326" y="208" font-size="10" fill="#57606a">Playlist</text>
  <text x="446" y="194" font-size="11" font-weight="600" fill="#24292f">Live album</text>
  <text x="446" y="208" font-size="10" fill="#57606a">Album</text>
  <text x="326" y="350" font-size="11" font-weight="600" fill="#24292f">Favorite band</text>
  <text x="326" y="364" font-size="10" fill="#57606a">Artist</text>
  <text x="446" y="350" font-size="11" font-weight="600" fill="#24292f">Dinner</text>
  <text x="446" y="364" font-size="10" fill="#57606a">Playlist</text>
  <g fill="#ffffff">
    <circle cx="414" cy="158" r="13" fill="#1db954"/><path d="M410,151 L421,158 L410,165 z"/>
    <circle cx="534" cy="158" r="13" fill="#1db954"/><path d="M530,151 L541,158 L530,165 z"/>
    <circle cx="414" cy="314" r="13" fill="#1db954"/><path d="M410,307 L421,314 L410,321 z"/>
    <circle cx="534" cy="314" r="13" fill="#1db954"/><path d="M530,307 L541,314 L530,321 z"/>
  </g>
  <text x="326" y="382" font-size="10" fill="#57606a">Plays on Living room</text>

  <!-- Recently played -->
  <rect x="590" y="30" width="260" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="606" y="56" font-size="13" font-weight="600" fill="#24292f">Spotify recently played</text>
  <g font-size="11">
    <rect x="606" y="74" width="40" height="40" rx="4" fill="url(#cover1)"/>
    <text x="656" y="90" font-weight="600" fill="#24292f">Track title</text>
    <text x="656" y="106" fill="#57606a">Artist</text>
    <rect x="782" y="80" width="52" height="18" rx="9" fill="#1db954"/>
    <text x="808" y="93" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Playing</text>

    <rect x="606" y="132" width="40" height="40" rx="4" fill="url(#cover2)"/>
    <text x="656" y="148" font-weight="600" fill="#24292f">Another track</text>
    <text x="656" y="164" fill="#57606a">Artist</text>
    <text x="834" y="148" text-anchor="end" fill="#57606a">18:42</text>

    <rect x="606" y="190" width="40" height="40" rx="4" fill="url(#cover3)"/>
    <text x="656" y="206" font-weight="600" fill="#24292f">Third track</text>
    <text x="656" y="222" fill="#57606a">Artist</text>
    <text x="834" y="206" text-anchor="end" fill="#57606a">18:38</text>

    <rect x="606" y="248" width="40" height="40" rx="4" fill="url(#cover4)"/>
    <text x="656" y="264" font-weight="600" fill="#24292f">Fourth track</text>
    <text x="656" y="280" fill="#57606a">Artist</text>
    <text x="834" y="264" text-anchor="end" fill="#57606a">18:35</text>

    <rect x="606" y="306" width="40" height="40" rx="4" fill="url(#cover1)"/>
    <text x="656" y="322" font-weight="600" fill="#24292f">Fifth track</text>
    <text x="656" y="338" fill="#57606a">Artist</text>
    <text x="834" y="322" text-anchor="end" fill="#57606a">18:31</text>
  </g>
</svg>
