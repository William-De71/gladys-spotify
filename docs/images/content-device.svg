<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The "Spotify" device: pick a playlist, recent track or favorite, then press Play on any Spotify Connect device</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Spotify device -->
  <rect x="30" y="40" width="300" height="250" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="50" y="70" font-size="15" font-weight="600" fill="#24292f">"Spotify" device</text>

  <text x="50" y="100" font-size="11" fill="#57606a">Playlists</text>
  <rect x="50" y="106" width="260" height="34" rx="6" fill="#edfbf1" stroke="#1db954" stroke-width="1.5"/>
  <text x="62" y="128" font-size="12" font-weight="600" fill="#116329">Playlist — Morning mix</text>
  <path d="M292,120 l6,6 l6,-6" fill="none" stroke="#116329" stroke-width="1.5"/>

  <text x="50" y="164" font-size="11" fill="#57606a">Recent tracks</text>
  <rect x="50" y="170" width="260" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="62" y="192" font-size="12" fill="#8c959f">not selected</text>
  <path d="M292,184 l6,6 l6,-6" fill="none" stroke="#8c959f" stroke-width="1.5"/>

  <text x="50" y="228" font-size="11" fill="#57606a">Favorites</text>
  <rect x="50" y="234" width="260" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="62" y="256" font-size="12" fill="#8c959f">not selected</text>
  <path d="M292,248 l6,6 l6,-6" fill="none" stroke="#8c959f" stroke-width="1.5"/>

  <!-- Pending selection -->
  <rect x="390" y="110" width="200" height="110" rx="12" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="490" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#6b4600">Pending selection</text>
  <text x="490" y="164" text-anchor="middle" font-size="11" fill="#24292f">spotify:playlist:…</text>
  <text x="490" y="188" text-anchor="middle" font-size="11" fill="#57606a">nothing plays yet,</text>
  <text x="490" y="204" text-anchor="middle" font-size="11" fill="#57606a">one selection at a time</text>

  <line x1="330" y1="165" x2="388" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="359" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">1</text>

  <!-- Connect devices -->
  <rect x="650" y="40" width="200" height="250" rx="12" fill="#f6fff8" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="750" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">Any Spotify Connect device</text>
  <rect x="670" y="90" width="160" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="684" y="120" font-size="12" fill="#24292f">Living room</text>
  <circle cx="806" cy="115" r="13" fill="#1db954"/>
  <path d="M801,108 L813,115 L801,122 z" fill="#ffffff"/>
  <rect x="670" y="150" width="160" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="684" y="180" font-size="12" fill="#24292f">Phone</text>
  <circle cx="806" cy="175" r="13" fill="#d0d7de"/>
  <path d="M801,168 L813,175 L801,182 z" fill="#ffffff"/>
  <rect x="670" y="210" width="160" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="684" y="240" font-size="12" fill="#24292f">Office computer</text>
  <circle cx="806" cy="235" r="13" fill="#d0d7de"/>
  <path d="M801,228 L813,235 L801,242 z" fill="#ffffff"/>

  <line x1="590" y1="140" x2="668" y2="116" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">2</text>

  <!-- Legend -->
  <text x="30" y="318" font-size="12" fill="#24292f"><tspan font-weight="600">1.</tspan> Picking an option only remembers it; the two other lists go back to "not selected".</text>
  <text x="30" y="340" font-size="12" fill="#24292f"><tspan font-weight="600">2.</tspan> Play on any Spotify Connect device launches the pending selection there, instead of a plain resume.</text>
</svg>
