<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the Spotify integration talks to Spotify and to your devices</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Gladys -->
  <rect x="30" y="40" width="200" height="110" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#0a3069">Gladys</text>
  <text x="130" y="104" text-anchor="middle" font-size="12" fill="#24292f">dashboard, scenes,</text>
  <text x="130" y="122" text-anchor="middle" font-size="12" fill="#24292f">configuration screen</text>

  <!-- Integration -->
  <rect x="330" y="40" width="220" height="110" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#6b4600">Spotify integration</text>
  <text x="440" y="104" text-anchor="middle" font-size="12" fill="#24292f">its own container,</text>
  <text x="440" y="122" text-anchor="middle" font-size="12" fill="#24292f">tokens in the Gladys config</text>

  <!-- Spotify cloud -->
  <rect x="650" y="40" width="200" height="110" rx="10" fill="#edfbf1" stroke="#1db954" stroke-width="1.5"/>
  <text x="750" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#116329">Spotify Web API</text>
  <text x="750" y="104" text-anchor="middle" font-size="12" fill="#24292f">your account, playback,</text>
  <text x="750" y="122" text-anchor="middle" font-size="12" fill="#24292f">playlists, covers</text>

  <!-- Top links -->
  <line x1="230" y1="95" x2="328" y2="95" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#57606a">WebSocket</text>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#57606a">+ host API</text>
  <line x1="550" y1="95" x2="648" y2="95" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="80" text-anchor="middle" font-size="11" fill="#57606a">HTTPS</text>
  <text x="600" y="114" text-anchor="middle" font-size="11" fill="#57606a">OAuth2 + PKCE</text>

  <!-- What Gladys gets -->
  <rect x="30" y="200" width="520" height="210" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="50" y="228" font-size="13" font-weight="600" fill="#24292f">What you get in Gladys</text>

  <rect x="50" y="244" width="232" height="148" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="66" y="268" font-size="14" font-weight="600" fill="#24292f">One device per</text>
  <text x="66" y="286" font-size="14" font-weight="600" fill="#24292f">Spotify Connect device</text>
  <text x="66" y="312" font-size="12" fill="#24292f">play · pause</text>
  <text x="66" y="332" font-size="12" fill="#24292f">previous · next</text>
  <text x="66" y="352" font-size="12" fill="#24292f">volume 0-100</text>
  <text x="66" y="372" font-size="12" fill="#24292f">playing / paused state</text>

  <rect x="298" y="244" width="232" height="148" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="314" y="268" font-size="14" font-weight="600" fill="#24292f">The "Spotify" device</text>
  <text x="314" y="286" font-size="14" font-weight="600" fill="#24292f">and 3 widgets</text>
  <text x="314" y="312" font-size="12" fill="#24292f">playlists, recent tracks,</text>
  <text x="314" y="332" font-size="12" fill="#24292f">favorites to launch</text>
  <text x="314" y="352" font-size="12" fill="#24292f">now playing, quick play,</text>
  <text x="314" y="372" font-size="12" fill="#24292f">recently played</text>

  <!-- Spotify Connect devices -->
  <rect x="650" y="200" width="200" height="210" rx="12" fill="#f6fff8" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="750" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">Spotify Connect devices</text>
  <rect x="670" y="246" width="160" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="750" y="271" text-anchor="middle" font-size="12" fill="#24292f">speakers, TVs</text>
  <rect x="670" y="296" width="160" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="750" y="321" text-anchor="middle" font-size="12" fill="#24292f">phones, tablets</text>
  <rect x="670" y="346" width="160" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="750" y="371" text-anchor="middle" font-size="12" fill="#24292f">computers</text>

  <line x1="750" y1="150" x2="750" y2="198" stroke="#1a7f37" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="760" y="178" font-size="11" fill="#116329">Spotify Connect</text>

  <!-- Integration to Gladys features -->
  <line x1="440" y1="150" x2="440" y2="198" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="172" font-size="11" fill="#57606a">playback read every 15 s,</text>
  <text x="450" y="186" font-size="11" fill="#57606a">lists every 20 min</text>
</svg>
