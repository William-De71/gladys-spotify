<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Connecting Gladys to Spotify: the OAuth2 flow through the Gladys redirect page</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="500" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Lanes -->
  <rect x="30" y="30" width="160" height="50" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="110" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Your browser</text>
  <rect x="250" y="30" width="160" height="50" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="330" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#6b4600">Gladys</text>
  <text x="330" y="70" text-anchor="middle" font-size="11" fill="#6b4600">+ Spotify integration</text>
  <rect x="470" y="30" width="160" height="50" rx="10" fill="#edfbf1" stroke="#1db954" stroke-width="1.5"/>
  <text x="550" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#116329">Spotify</text>
  <rect x="690" y="30" width="160" height="50" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="770" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#0a3069">Redirect page</text>
  <text x="770" y="70" text-anchor="middle" font-size="11" fill="#0a3069">my.gladysassistant.com</text>

  <line x1="110" y1="80" x2="110" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="330" y1="80" x2="330" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="550" y1="80" x2="550" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="770" y1="80" x2="770" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 1 -->
  <line x1="110" y1="122" x2="328" y2="122" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="114" text-anchor="middle" font-size="12" fill="#24292f">1. click "Connect with Spotify"</text>
  <line x1="330" y1="152" x2="112" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#57606a">authorization URL (state, PKCE challenge)</text>

  <!-- 2 -->
  <line x1="110" y1="206" x2="548" y2="206" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="198" text-anchor="middle" font-size="12" fill="#24292f">2. sign in to Spotify, click "Agree"</text>

  <!-- 3 -->
  <line x1="550" y1="246" x2="768" y2="246" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="660" y="238" text-anchor="middle" font-size="12" fill="#24292f">3. browser sent to the</text>
  <text x="660" y="264" text-anchor="middle" font-size="11" fill="#57606a">redirect URI ?code=…&amp;state=…</text>

  <!-- 4 -->
  <line x1="770" y1="296" x2="332" y2="296" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="550" y="288" text-anchor="middle" font-size="12" fill="#24292f">4. bounced back to your Gladys (its address travels in the state)</text>

  <!-- 5 -->
  <line x1="330" y1="344" x2="548" y2="344" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="336" text-anchor="middle" font-size="12" fill="#24292f">5. code + PKCE verifier + Client Secret</text>
  <line x1="550" y1="374" x2="332" y2="374" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="392" text-anchor="middle" font-size="11" fill="#116329">access token + refresh token</text>

  <!-- Notes -->
  <rect x="30" y="432" width="820" height="50" rx="10" fill="#f6fff8" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="450" y="453" text-anchor="middle" font-size="12" fill="#116329">The tokens only travel between the integration and Spotify, and stay in /data. The redirect page is static and stores nothing.</text>
  <text x="450" y="471" text-anchor="middle" font-size="12" fill="#116329">The access token is refreshed automatically; Spotify asks for a new authorization every 6 months.</text>
</svg>
