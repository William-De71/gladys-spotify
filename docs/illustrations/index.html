<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="vendor/theme/package/dashboard.css" />
    <link rel="stylesheet" href="widget.css" />
    <link rel="stylesheet" href="dark-mode.css" />
    <link rel="stylesheet" href="horizon.css" />
    <style>
      body {
        background: #fff;
        margin: 0;
        padding: 8px;
      }
      /* the page header of the theme shares the class name of the widget
         header slot (a CSS module class in Gladys): keep it off the widget */
      .card .header {
        padding: 0;
        background: none;
        border-bottom: 0;
      }
      /* the dashboard scene, a margin around the cards for their shadow */
      #stage {
        display: inline-block;
        overflow: hidden;
        padding: 40px 44px 56px;
      }
      #row {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .col {
        width: 380px;
        flex: none;
        padding: 0;
      }
      .card {
        margin-bottom: 0;
      }
    </style>
    <script src="data.js"></script>
  </head>
  <body>
    <div id="stage" class="glass-theme glassScene"><div id="row"></div></div>
    <script>
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    </script>
    <script src="render.js"></script>
  </body>
</html>
